# 没钱 No Money — Web 静态站 Nginx 配置
# 与 docs/DEPLOYMENT.md 的 Nginx 段一致：SPA 回退 + 分级缓存 + 安全头

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip：文本类资源压缩后体积减 60-70%，echarts 块从 880KB 降到约 290KB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 带 hash 的静态资源：一年 + immutable（内容变则文件名变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker 与入口必须 no-cache，否则用户拿不到新版本
    location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # 政策数据：允许短缓存，Service Worker 会做 stale-while-revalidate
    location ~* ^/(rules|knowledge)/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 回退：深链接（/policy、/admin、/rights）必须返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
