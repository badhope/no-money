name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (source)
        run: npm run typecheck

      - name: Typecheck (tests and scripts)
        run: npm run typecheck:test

      - name: Unit, parity and component tests
        run: npm test

      - name: Engine self-check
        run: npm run verify

      - name: Reality-check data gates
        run: npm run verify:reality

      - name: Knowledge base in sync
        run: npm run kb:check

      - name: Build
        run: npm run build

      - name: No sourcemaps in production build
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "::error::dist contains .map files; production must not ship source maps"
            find dist -name '*.map' | head -5
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
