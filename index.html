  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    /* 默认浅色（与 variables.css :root 一致），data-theme=dark 时覆盖为深色；
       Vue 挂载前的首帧按最终主题渲染，避免深色用户每次先闪一帧浅色（FOUC） */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    html[data-theme='dark'] body {
      background: #111c2e;
      color: #e8eef6;
    }
    #app { height: 100%; }
  </style>
  <script>
    ;(function () {
      try {
        // 默认浅色；只有用户显式选过深色才切深色。
        // 不读 prefers-color-scheme：本产品白天户外使用为主，系统深色不代表这里要深色。
        var t = localStorage.getItem('theme')
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) { /* 存储不可用时按默认浅色渲染 */ }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="padding:32px;text-align:center;font-size:14px;line-height:1.8">
      本应用是纯前端计算器，需要启用 JavaScript 才能运行。<br />
      所有测算都在你的浏览器本地完成，不上传任何数据。
    </div>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
